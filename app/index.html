<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EC">
  <title>Ementa SR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Neutros quentes (papel, balcão) */
      --bg: #F6F2EC;
      --surface: #FFFFFF;
      --surface-2: #FBF8F4;
      --line: rgba(40, 28, 18, 0.10);
      --line-strong: rgba(40, 28, 18, 0.18);
      --text: #1F1A16;
      --text-2: #5C544D;
      --muted: #8E857C;

      /* Marca: o mesmo vermelho da Story */
      --red: #CA2915;
      --red-ink: #A82110;
      --red-tint: #FBEDEA;

      --ok: #2E7D4F;

      --r-sm: 10px;
      --r: 14px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input {
      -webkit-user-select: auto;
      user-select: auto;
    }

    svg.i {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ── Cabeçalho ── */
    .header {
      background: var(--surface);
      border-top: 4px solid var(--red);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-logo {
      height: 44px;
      width: auto;
      display: block;
    }

    .header-meta {
      text-align: right;
    }

    .header-title {
      font-family: 'Bree Serif', serif;
      font-size: 18px;
      color: var(--text);
      line-height: 1.2;
    }

    .header-date {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Conteúdo ── */
    .content {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 140px;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-label {
      font-family: 'Bree Serif', serif;
      font-size: 22px;
      color: var(--text);
    }

    .count-badge {
      display: none;
      font-size: 13px;
      font-weight: 500;
      color: var(--red-ink);
      font-variant-numeric: tabular-nums;
    }

    /* ── Local ── */
    .local-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .local-btn {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      color: var(--text-2);
      transition: background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
      touch-action: manipulation;
    }

    .local-btn .lname {
      font-family: 'Bree Serif', serif;
      font-size: 20px;
      display: block;
    }

    .local-btn.active {
      background: var(--red-tint);
      border-color: var(--red);
      color: var(--red-ink);
      box-shadow: inset 0 0 0 1px var(--red);
    }

    /* ── Pesquisa ── */
    .search-wrap {
      position: relative;
      margin-bottom: 8px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      display: flex;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 12px 12px 12px 44px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color .15s var(--ease);
    }

    .search-input::placeholder,
    .add-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus,
    .add-input:focus {
      border-color: var(--text-2);
    }

    /* ── Listas ── */
    .dishes-list {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      max-height: 340px;
      overflow-y: auto;
      scrollbar-width: thin;
      overscroll-behavior: contain;
    }

    .dish-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background-color .12s var(--ease);
    }

    .dish-item:last-child {
      border-bottom: none;
    }

    .dish-item:active {
      background: var(--surface-2);
    }

    .dish-item.selected {
      background: var(--red-tint);
    }

    .dish-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--line-strong);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: background-color .12s var(--ease), border-color .12s var(--ease);
    }

    .dish-check svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dish-item.selected .dish-check {
      background: var(--red);
      border-color: var(--red);
    }

    .dish-name {
      font-size: 16px;
      color: var(--text);
      flex: 1;
      line-height: 1.35;
    }

    .dish-item.selected .dish-name {
      font-weight: 500;
    }

    .dish-tag {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Adicionar ── */
    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .add-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 1px dashed var(--line-strong);
      border-radius: var(--r-sm);
      padding: 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }

    .add-btn {
      width: 48px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .add-btn:active {
      background: var(--surface-2);
    }

    /* ── Resumo: o talão ── */
    .summary-box {
      display: none;
      position: relative;
      background: var(--surface);
      padding: 24px 20px 20px;
      margin: 0 4px 24px;
      box-shadow: 0 1px 2px rgba(40, 28, 18, 0.06), 0 8px 24px rgba(40, 28, 18, 0.06);
      -webkit-mask: radial-gradient(circle 6px at 50% 0, transparent 98%, #000) 0 0 / 16px 51% repeat-x,
        radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 100% / 16px 51% repeat-x;
      mask: radial-gradient(circle 6px at 50% 0, transparent 98%, #000) 0 0 / 16px 51% repeat-x,
        radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 100% / 16px 51% repeat-x;
    }

    .summary-box.visible {
      display: block;
    }

    .summary-ttl {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.02em;
    }

    .summary-local {
      font-family: 'Bree Serif', serif;
      font-size: 24px;
      color: var(--red);
      text-align: center;
      margin-top: 4px;
    }

    .summary-rule {
      border: none;
      border-top: 1px dashed var(--line-strong);
      margin: 16px 0;
    }

    .summary-group+.summary-group {
      margin-top: 16px;
    }

    .summary-group-ttl {
      font-family: 'Bree Serif', serif;
      font-size: 16px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .summary-line {
      font-size: 15px;
      color: var(--text-2);
      line-height: 1.6;
    }

    .summary-empty {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }

    /* ── Botão publicar (fixo em baixo) ── */
    .submit-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to top, var(--bg) 70%, rgba(246, 242, 236, 0));
      padding: 24px 20px calc(16px + env(safe-area-inset-bottom));
      z-index: 50;
    }

    .submit-btn {
      display: block;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      background: var(--red);
      border: none;
      border-radius: var(--r);
      color: #fff;
      font-family: 'Bree Serif', serif;
      font-size: 20px;
      padding: 16px;
      cursor: pointer;
      transition: background-color .15s var(--ease), transform .1s var(--ease);
      touch-action: manipulation;
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      background: #E7E1D9;
      color: var(--muted);
      cursor: not-allowed;
    }

    .submit-sub {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 112px;
      left: 50%;
      transform: translate(-50%, 12px);
      opacity: 0;
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--r-sm);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      z-index: 999;
      transition: transform .2s var(--ease), opacity .2s var(--ease);
      pointer-events: none;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(6px);
      }
    }

    /* ── PIN ── */
    .pin-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .pin-screen.hidden {
      display: none;
    }

    .pin-logo {
      height: 64px;
      width: auto;
      margin-bottom: 24px;
    }

    .pin-title {
      font-family: 'Bree Serif', serif;
      font-size: 26px;
      color: var(--text);
      text-align: center;
    }

    .pin-sub {
      font-size: 15px;
      color: var(--text-2);
      text-align: center;
      margin-top: 4px;
    }

    .pin-dots {
      display: flex;
      gap: 16px;
      margin-top: 28px;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid var(--line-strong);
      transition: background-color .12s var(--ease), border-color .12s var(--ease);
    }

    .pin-dot.filled {
      background: var(--red);
      border-color: var(--red);
    }

    .pin-error {
      font-size: 14px;
      color: var(--red-ink);
      text-align: center;
      min-height: 20px;
      margin: 12px 0 16px;
      font-weight: 500;
    }

    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 288px;
    }

    .pin-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
      transition: background-color .1s var(--ease), transform .1s var(--ease);
      touch-action: manipulation;
      box-shadow: 0 1px 2px rgba(40, 28, 18, 0.05);
    }

    .pin-btn:active {
      background: var(--surface-2);
      transform: scale(0.96);
    }

    .pin-btn.del {
      color: var(--text-2);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .pin-btn.empty {
      background: transparent;
      border: none;
      box-shadow: none;
      cursor: default;
    }

    .pin-btn.empty:active {
      transform: none;
    }

    /* ── Confirmação ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(31, 26, 22, 0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s var(--ease);
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 28px 20px calc(20px + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 480px;
      transform: translateY(24px);
      transition: transform .25s var(--ease);
    }

    .modal-overlay.show .modal-box {
      transform: translateY(0);
    }

    .modal-title {
      font-family: 'Bree Serif', serif;
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 15px;
      color: var(--text-2);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-text strong {
      color: var(--text);
      font-weight: 600;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn-cancel,
    .btn-confirm {
      flex: 1;
      padding: 16px;
      border-radius: var(--r-sm);
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-cancel {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      color: var(--text);
    }

    .btn-confirm {
      background: var(--red);
      border: none;
      color: #fff;
    }

    .btn-cancel:active,
    .btn-confirm:active {
      transform: scale(0.98);
    }

    /* ── Enviada ── */
    .success {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 32px;
      text-align: center;
      animation: fadeIn .3s var(--ease);
    }

    .success-mark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--ok);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .success-mark svg {
      width: 40px;
      height: 40px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-title {
      font-family: 'Bree Serif', serif;
      font-size: 28px;
      color: var(--text);
    }

    .success-text {
      font-size: 15px;
      color: var(--text-2);
      max-width: 280px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="pinScreen" class="pin-screen">
    <img class="pin-logo" src="https://www.churrasqueirasr.pt/assets/img/logo-sr.png"
      onerror="this.onerror=null;this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEUtsd4hVkx2VT8FNzBJzjV7fMZl8O7glf6A&s'"
      alt="Churrasqueira SR">
    <div class="pin-title">Ementa do dia</div>
    <div class="pin-sub">Introduz o PIN para continuar</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-error" id="pinErro"></div>
    <div class="pin-pad">
      <div class="pin-btn" onpointerdown="pinPress('1')">1</div>
      <div class="pin-btn" onpointerdown="pinPress('2')">2</div>
      <div class="pin-btn" onpointerdown="pinPress('3')">3</div>
      <div class="pin-btn" onpointerdown="pinPress('4')">4</div>
      <div class="pin-btn" onpointerdown="pinPress('5')">5</div>
      <div class="pin-btn" onpointerdown="pinPress('6')">6</div>
      <div class="pin-btn" onpointerdown="pinPress('7')">7</div>
      <div class="pin-btn" onpointerdown="pinPress('8')">8</div>
      <div class="pin-btn" onpointerdown="pinPress('9')">9</div>
      <div class="pin-btn empty"></div>
      <div class="pin-btn" onpointerdown="pinPress('0')">0</div>
      <div class="pin-btn del" onpointerdown="pinDel()" aria-label="Apagar"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><path d="m17 9-6 6"/><path d="m11 9 6 6"/></svg></div>
    </div>
  </div>

  <div class="header">
    <div class="header-inner">
      <img class="header-logo" src="https://www.churrasqueirasr.pt/assets/img/logo-sr.png"
        onerror="this.onerror=null;this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEUtsd4hVkx2VT8FNzBJzjV7fMZl8O7glf6A&s'"
        alt="Churrasqueira SR">
      <div class="header-meta">
        <div class="header-title">Ementa do dia</div>
        <div class="header-date" id="dateBadge"></div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="section">
      <div class="section-head">
        <div class="section-label">Local</div>
      </div>
      <div class="local-grid">
        <div class="local-btn" id="btnI" onpointerdown="selectLocal('Infantado')">
          <span class="lname">Infantado</span>
        </div>
        <div class="local-btn" id="btnO" onpointerdown="selectLocal('Odivelas')">
          <span class="lname">Odivelas</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Sopas</div>
        <span class="count-badge" id="sopaBadge">0</span>
      </div>
      <div class="search-wrap">
        <span class="search-icon"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input class="search-input" id="sopaSearch" placeholder="Pesquisar sopa" oninput="filterSopas(this.value)"
          autocomplete="off">
      </div>
      <div class="dishes-list" id="sopasList"></div>
      <div class="add-row">
        <input class="add-input" id="sopaNewInput" placeholder="Adicionar sopa nova" autocomplete="off">
        <button class="add-btn" onclick="addNewSopa()" aria-label="Adicionar sopa"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Pratos</div>
        <span class="count-badge" id="pratosCount">0</span>
      </div>
      <div class="search-wrap">
        <span class="search-icon"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input class="search-input" id="pratosSearch" placeholder="Pesquisar prato"
          oninput="filterPratos(this.value)" autocomplete="off">
      </div>
      <div class="dishes-list" id="pratosList"></div>
      <div class="add-row">
        <input class="add-input" id="pratoNewInput" placeholder="Adicionar prato novo" autocomplete="off">
        <button class="add-btn" onclick="addNewPrato()" aria-label="Adicionar prato"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
      </div>
    </div>

    <div class="summary-box" id="summaryBox">
      <div class="summary-ttl">Resumo da ementa</div>
      <div id="summaryContent"></div>
    </div>

  </div>

  <div class="submit-bar">
    <button class="submit-btn" id="submitBtn" onclick="submitEmenta()" disabled>
      Publicar ementa
      <span class="submit-sub" id="submitSub">Escolhe o local, uma sopa e um prato</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="confirmModal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-title">Publicar agora?</div>
      <div class="modal-text">
        A ementa de <strong id="modalLocalText">Local</strong> vai para o Instagram e o Facebook.
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-confirm" onclick="realSubmitEmenta()">Publicar</button>
      </div>
    </div>
  </div>

  <script>
    // O TEU WEBHOOK
    const WEBHOOK = '<removed from history: Make webhook URL>';

    const SOPAS = [
      "Canja", "Juliana", "Creme de legumes", "Alho francês", "Portuguesa",
      "Espinafres", "Feijão verde", "Agrião", "Nabiça", "Caldo verde",
      "Creme de cenoura", "Couve galega c/feijão branco", "Espinafres com feijão branco",
      "Espinafres com grão", "Feijão", "Nabiça com feijão branco", "Nabiça com grão",
      "Lombardo com feijão", "Alho francês com grão", "Lavrador", "Primavera", "Peixe",
      "Couve à portuguesa com feijão catarino"
    ];

    const TOP_SOPAS = SOPAS.slice(0, 5);

    const TOP_PRATOS = [
      "Frango à Brás", "Bacalhau com natas", "Empadão", "Bacalhau espiritual",
      "Arroz de pato", "Bacalhau c/natas e espinafres", "Bacalhau à lagareiro",
      "Dourada grelhada", "Robalo grelhado", "Salmão grelhado"
    ];

    const PRATOS = [
      ...TOP_PRATOS,
      "Delícia de bacalhau com gambas", "Lasanha de carne", "Lasanha de frango",
      "Choco à lagareiro", "Polvo à lagareiro", "Cozido à portuguesa",
      "Ervilhas com ovos escalfados", "Jardineira de vitela", "Vitela no tacho com puré",
      "Bacalhau à Brás", "Bacalhau à Zé do Pipo", "Bacalhau com broa à SR",
      "Bacalhau à minhota", "Bacalhau fresco no forno", "Bacalhau com broa à posta",
      "Lulas à lagareiro", "Lulas recheadas com puré", "Lulas estufadas",
      "Feijoada à transmontana", "Feijoada de choco", "Feijoada de lulas",
      "Mão de vaca com grão", "Dobrada", "Dobrada com feijão branco",
      "Lombo no forno", "Lombo no tacho com puré", "Lombo de porco no forno",
      "Arroz de frango no forno", "Massinha de peixe", "Red fish no forno",
      "Peixe espada grelhada", "Solha frita c/arroz de feijão",
      "Pescadinha frita c/arroz de feijão", "Sardinhas fritas",
      "Empadão de carne", "Empadão de frango",
      "Bochechas estufadas com puré", "Bochechas no forno", "Bochechas no tacho",
      "Vitela no tacho com batata assada", "Maminha assada no forno", "Maminha estufada", "Maminha no tacho",
      "Cabrito assado no forno", "Borrego no forno", "Borrego no tacho",
      "Carne de porco à portuguesa", "Carne à alentejana",
      "Coelho à caçador", "Coelho estufado", "Coelho no tacho",
      "Alheira de vitela Mirandesa", "Alheira Mirandesa",
      "Bifinhos de frango", "Bifinhos de peru com cogumelos", "Bifinhos à cebolada",
      "Almôndegas com esparguete", "Almôndegas com puré", "Esparguete à bolonhesa",
      "Jardineira de frango", "Jardineira de borrego",
      "Hambúrguer de picanha SR", "Hambúrguer de vitela Mirandesa",
      "Iscas de vitela Mirandesa", "Iscas à portuguesa", "Iscas de porco",
      "Entrecosto frito com migas", "Entrecosto no forno", "Favas com entrecosto",
      "Rancho à transmontana", "Rancho a minhota", "Rancho à portuguesa",
      "Pernil no forno", "Medalhões de lombo de porco grelhado",
      "Açorda de bacalhau", "Açorda de gambas", "Açorda de marisco",
      "Moelas estufadas", "Frango estufado com batata", "Frango de caril", "Frango do campo no tacho",
      "Pataniscas vegetarianas c/arroz de legumes",
      "Leitão à Bairrada", "Lombo de leitão",
      "Osso buco no tacho com puré", "Rolo de carne recheado", "Salsicha enrolada em lombardo",
      "Strogonoff de peru", "Peito de peru no forno",
      "Bacalhau lascado", "Escalope de vitela Mirandesa", "Polvo no forno", "Arroz de polvo"
    ];

    let state = { local: null, sopas: new Set(), pratos: new Set() };
    const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    // Função mágica que limpa os acentos todos para a pesquisa
    function limpaAcentos(texto) {
      return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function loadExtra() {
      try { return JSON.parse(localStorage.getItem('sr_extras') || '{"sopas":[],"pratos":[]}'); }
      catch (e) { return { sopas: [], pratos: [] }; }
    }
    function saveExtra(type, item) {
      const ex = loadExtra();
      if (!ex[type].includes(item)) ex[type].push(item);
      try { localStorage.setItem('sr_extras', JSON.stringify(ex)); } catch (e) { }
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkPin();
      const d = new Date();
      const ds = d.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('dateBadge').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
      renderSopas('');
      renderPratos('');
    });

    function selectLocal(l) {
      state.local = l;
      document.getElementById('btnI').classList.toggle('active', l === 'Infantado');
      document.getElementById('btnO').classList.toggle('active', l === 'Odivelas');
      updateSummary(); updateSubmit();
    }

    function getAllSopas() {
      const ex = loadExtra();
      return [...SOPAS, ...ex.sopas.filter(s => !SOPAS.includes(s))];
    }
    function renderSopas(filter) {
      const c = document.getElementById('sopasList');
      const ex = loadExtra();
      const all = getAllSopas();

      let list = all;
      if (filter) {
        const f = limpaAcentos(filter); // Limpa a pesquisa
        list = all.filter(s => limpaAcentos(s).includes(f)).sort((a, b) => {
          const aStart = limpaAcentos(a).startsWith(f);
          const bStart = limpaAcentos(b).startsWith(f);
          if (aStart && !bStart) return -1;
          if (!aStart && bStart) return 1;
          return 0;
        });
      }

      if (!list.length) { c.innerHTML = '<div class="empty-state">Sem resultados</div>'; return; }
      c.innerHTML = list.map(s => {
        const sel = state.sopas.has(s);
        const isNew = ex.sopas.includes(s);
        const isTopSopa = TOP_SOPAS.includes(s) && !filter;
        return `<div class="dish-item${sel ? ' selected' : ''}" onclick="toggleSopa('${s.replace(/'/g, "\'")}')">
      <div class="dish-check">${sel ? CHECK : ''}</div>
      <div class="dish-name">${s}</div>
      ${isTopSopa ? '<span class="dish-tag">habitual</span>' : ''}
      ${isNew ? '<span class="dish-tag">nova</span>' : ''}
    </div>`;
      }).join('');
    }
    function filterSopas(v) { renderSopas(v); }
    function toggleSopa(s) {
      if (state.sopas.has(s)) { state.sopas.delete(s); }
      else if (state.sopas.size >= 2) { showToast('Máximo 2 sopas'); return; }
      else { state.sopas.add(s); }
      const b = document.getElementById('sopaBadge');
      b.textContent = state.sopas.size + ' de 2';
      b.style.display = state.sopas.size > 0 ? 'inline-block' : 'none';
      renderSopas(document.getElementById('sopaSearch').value);
      updateSummary(); updateSubmit();
    }
    function addNewSopa() {
      const inp = document.getElementById('sopaNewInput');
      const v = inp.value.trim(); if (!v) return;
      const f = v[0].toUpperCase() + v.slice(1);
      saveExtra('sopas', f); inp.value = '';
      renderSopas(''); toggleSopa(f);
      showToast('"' + f + '" guardada');
    }

    function getAllPratos() {
      const ex = loadExtra();
      const rest = PRATOS.filter(p => !TOP_PRATOS.includes(p));
      return [...TOP_PRATOS, ...rest, ...ex.pratos.filter(p => !PRATOS.includes(p))];
    }
    function renderPratos(filter) {
      const c = document.getElementById('pratosList');
      const ex = loadExtra();
      const all = getAllPratos();

      let list = all;
      if (filter) {
        const f = limpaAcentos(filter); // Limpa a pesquisa
        list = all.filter(p => limpaAcentos(p).includes(f)).sort((a, b) => {
          const aStart = limpaAcentos(a).startsWith(f);
          const bStart = limpaAcentos(b).startsWith(f);
          if (aStart && !bStart) return -1;
          if (!aStart && bStart) return 1;
          return 0;
        });
      }

      if (!list.length) { c.innerHTML = '<div class="empty-state">Sem resultados</div>'; return; }
      c.innerHTML = list.map(p => {
        const sel = state.pratos.has(p);
        const isTop = TOP_PRATOS.includes(p) && !filter;
        const isNew = ex.pratos.includes(p);
        return `<div class="dish-item${sel ? ' selected' : ''}" onclick="togglePrato('${p.replace(/'/g, "\'")}')">
      <div class="dish-check">${sel ? CHECK : ''}</div>
      <div class="dish-name">${p}</div>
      ${isTop ? '<span class="dish-tag">habitual</span>' : ''}
      ${isNew ? '<span class="dish-tag">novo</span>' : ''}
    </div>`;
      }).join('');
    }
    function filterPratos(v) { renderPratos(v); }
    function togglePrato(p) {
      state.pratos.has(p) ? state.pratos.delete(p) : state.pratos.add(p);
      const b = document.getElementById('pratosCount');
      b.textContent = state.pratos.size + (state.pratos.size === 1 ? ' escolhido' : ' escolhidos');
      b.style.display = state.pratos.size > 0 ? 'inline-block' : 'none';
      renderPratos(document.getElementById('pratosSearch').value);
      updateSummary(); updateSubmit();
    }
    function addNewPrato() {
      const inp = document.getElementById('pratoNewInput');
      const v = inp.value.trim(); if (!v) return;
      const f = v[0].toUpperCase() + v.slice(1);
      saveExtra('pratos', f); inp.value = '';
      document.getElementById('pratosSearch').value = '';
      renderPratos(''); togglePrato(f);
      showToast('"' + f + '" guardado');
    }

    function updateSummary() {
      const box = document.getElementById('summaryBox');
      const con = document.getElementById('summaryContent');
      if (!state.local && state.sopas.size === 0 && state.pratos.size === 0) { box.classList.remove('visible'); return; }
      box.classList.add('visible');
      let h = '<div class="summary-local">' + (state.local || 'Escolhe o local') + '</div>';
      h += '<hr class="summary-rule">';
      if (state.sopas.size > 0) {
        h += '<div class="summary-group"><div class="summary-group-ttl">Sopas</div>';
        h += [...state.sopas].map(s => '<div class="summary-line">' + s + '</div>').join('') + '</div>';
      }
      if (state.pratos.size > 0) {
        h += '<div class="summary-group"><div class="summary-group-ttl">Pratos</div>';
        h += [...state.pratos].map(p => '<div class="summary-line">' + p + '</div>').join('') + '</div>';
      }
      if (state.sopas.size === 0 && state.pratos.size === 0) {
        h += '<div class="summary-empty">Ainda sem sopas nem pratos</div>';
      }
      con.innerHTML = h;
    }

    function updateSubmit() {
      const btn = document.getElementById('submitBtn');
      const sub = document.getElementById('submitSub');
      const ok = state.local && state.sopas.size > 0 && state.pratos.size > 0;
      btn.disabled = !ok;

      if (!state.local) {
        sub.textContent = 'Escolhe o local';
      } else if (state.sopas.size === 0) {
        sub.textContent = 'Escolhe pelo menos uma sopa';
      } else if (state.pratos.size === 0) {
        sub.textContent = 'Escolhe pelo menos um prato';
      } else {
        const ns = state.sopas.size, np = state.pratos.size;
        sub.textContent = state.local + ' · ' + ns + (ns === 1 ? ' sopa' : ' sopas') + ' · ' + np + (np === 1 ? ' prato' : ' pratos');
      }
    }

    let estadoConfirmacao = false;
    let timerConfirmacao;

    function submitEmenta() {
      document.getElementById('modalLocalText').textContent = state.local;
      document.getElementById('confirmModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('show');
    }

    async function realSubmitEmenta() {
      closeModal();

      const btn = document.getElementById('submitBtn');
      const sub = document.getElementById('submitSub');
      btn.disabled = true;
      sub.textContent = 'A publicar...';

      try {
        const r = await fetch(WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            local: state.local,
            sopas: [...state.sopas],
            pratos: [...state.pratos]
          })
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        showSuccess();
      } catch (e) {
        showToast('Não foi possível enviar. Tenta de novo.');
        btn.disabled = false;
        updateSubmit();
      }
    }

    function showSuccess() {
      const overlay = document.createElement('div');
      overlay.id = 'successOverlay';
      overlay.className = 'success';
      overlay.innerHTML =
        '<div class="success-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
        '<div class="success-title">Ementa enviada</div>' +
        '<div class="success-text">Vai sair no Instagram e no Facebook dentro de momentos.</div>';

      document.body.appendChild(overlay);

      // Como tirámos o botão, a app fecha o ecrã verde sozinha passado 3.5 segundos!
      setTimeout(() => {
        resetForm();
      }, 3500);
    }

    function resetForm() {
      state = { local: null, sopas: new Set(), pratos: new Set() };
      document.getElementById('btnI').classList.remove('active');
      document.getElementById('btnO').classList.remove('active');
      document.getElementById('sopaBadge').style.display = 'none';
      document.getElementById('pratosCount').style.display = 'none';
      document.getElementById('summaryBox').classList.remove('visible');
      document.getElementById('sopaSearch').value = '';
      document.getElementById('pratosSearch').value = '';
      renderSopas(''); renderPratos('');
      updateSubmit();
      document.getElementById('successOverlay')?.remove();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ── PIN ──────────────────────────────────────────────
    const PINS_VALIDOS = ['<removed from history>']; // ← define aqui os 3 PINs
    const PIN_MINUTOS = 10;
    const PIN_KEY = 'sr_pin_oficial'; // ← A chave nova para obrigar a aparecer agora
    let pinDigitos = '';

    function checkPin() {
      try {
        const ts = parseInt(localStorage.getItem(PIN_KEY) || '0');
        if (Date.now() - ts < PIN_MINUTOS * 60000) {
          document.getElementById('pinScreen').classList.add('hidden');
        }
      } catch (e) { }
    }

    function pinPress(d) {
      if (pinDigitos.length >= 4) return;
      pinDigitos += d;
      updatePinDots();
      if (pinDigitos.length === 4) setTimeout(checkPinCode, 80);
    }

    function pinDel() {
      pinDigitos = pinDigitos.slice(0, -1);
      updatePinDots();
      document.getElementById('pinErro').textContent = '';
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById('pd' + i).classList.toggle('filled', i < pinDigitos.length);
      }
    }

    function checkPinCode() {
      if (PINS_VALIDOS.includes(pinDigitos)) {
        try { localStorage.setItem(PIN_KEY, Date.now().toString()); } catch (e) { }
        document.getElementById('pinScreen').classList.add('hidden');
        pinDigitos = ''; // Limpa os pontinhos em background
        updatePinDots();
      } else {
        document.getElementById('pinErro').textContent = 'PIN incorreto. Tenta de novo.';
        const dots = document.getElementById('pinDots');

        // Truque de mestre: forçar o CSS a reiniciar a animação
        dots.style.animation = 'none';
        void dots.offsetWidth; // Isto obriga o ecrã a atualizar
        dots.style.animation = 'shake 0.4s ease';

        setTimeout(() => {
          pinDigitos = '';
          updatePinDots();
          document.getElementById('pinErro').textContent = '';
        }, 700);
      }
    }

    document.addEventListener('keydown', e => {
      const pinVisible = !document.getElementById('pinScreen').classList.contains('hidden');
      if (pinVisible) {
        if (e.key >= '0' && e.key <= '9') pinPress(e.key);
        if (e.key === 'Backspace') pinDel();
        return;
      }
      if (e.key !== 'Enter') return;
      if (document.activeElement.id === 'sopaNewInput') addNewSopa();
      if (document.activeElement.id === 'pratoNewInput') addNewPrato();
    });

    // ── HACKS ANTI-ZOOM E ANTI-SCROLL PARA IOS ──

    // 1. Bloqueia o duplo clique de fazer zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault(); // Corta o zoom mal o dedo levanta a 2ª vez
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 2. Bloqueia o "beliscão" (pinch) com dois dedos
    document.addEventListener('gesturestart', function (event) {
      event.preventDefault();
    });

    // 3. Previne que a página "estique" para cima/baixo (Rubber-band scroll) no ecrã do PIN
    document.body.addEventListener('touchmove', function (event) {
      const pinVisible = !document.getElementById('pinScreen').classList.contains('hidden');
      if (pinVisible) {
        event.preventDefault(); // Tranca o ecrã só quando o PIN está aberto
      }
    }, { passive: false });
  </script>
</body>

</html>
